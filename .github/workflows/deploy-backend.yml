name: Deploy Backend

on:
  push:
    branches: ["master", "main"]
    paths:
      - "backend/**"
      - "packages/shared/**"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build -w backend

      - name: Verify health route compiles
        run: node -e "import('./backend/dist/index.js').catch(() => process.exit(0))"
