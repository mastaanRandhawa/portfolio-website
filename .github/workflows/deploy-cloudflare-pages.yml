name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            echo "Create an API token at https://dash.cloudflare.com/profile/api-tokens"
            echo "Use the 'Edit Cloudflare Workers' template (includes Pages permissions)."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."
            echo "Find your Account ID in the Cloudflare dashboard URL or Overview page."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        run: npm run build
        env:
          CF_PAGES: "1"
          NEXT_PUBLIC_SITE_URL: https://doxastudios.ca

      - name: Verify build output
        run: |
          test -d frontend/out || (echo "::error::frontend/out not found — check build output directory" && exit 1)
          test -f frontend/out/index.html || (echo "::error::frontend/out/index.html missing" && exit 1)
          ls -la frontend/out | head -20

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"
          command: pages deploy frontend/out --project-name=doxa-studios --commit-dirty=true
